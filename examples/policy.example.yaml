# Copy to .agentwarden/policy.yaml in the project you want to protect and edit.
# Built-in protections (secrets, AgentWarden self-protection) always apply; this file cannot weaken them.
version: 1

# normal (default) | read_only. In read_only only Read/Glob/Grep inside the project are allowed;
# every other tool (edits, shell, network, MCP) asks, and the allow_* lists below are ignored.
# Use it to look at untrusted code. A typo here makes the daemon ignore the whole file
# (logged once) and run in normal mode.
mode: normal

# Absolute folders outside the project the agent may use without asking (searches included).
# Relative paths and filesystem roots are ignored. For one session only, use the dashboard's
# "Allow folder for this session" button instead.
extra_roots: []

# Paths are globs relative to the project root.
deny_paths: ["secrets/", "*.pem", "*.key"]
ask_paths: ["migrations/", "infra/"]
allow_paths: ["docs/"]

# Commands match by prefix.
deny_commands: ["terraform apply", "kubectl delete", "git push --force"]
ask_commands: ["npm publish"]
allow_commands: ["make test", "uv run pytest"]

# Network: hosts the agent may reach without asking.
allow_domains: ["pypi.org", "github.com"]
