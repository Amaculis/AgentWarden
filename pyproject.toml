[project]
name = "agentwarden"
version = "1.0.0"
description = "Semantic firewall for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
agentwarden = "agentwarden.cli:main"

[project.urls]
Homepage = "https://github.com/Amaculis/AgentWarden"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwarden"]
exclude = ["__pycache__", "*.pyc"]

# Spec 037: the installed tool carries its own hook scripts and model prompts.
[tool.hatch.build.targets.wheel.force-include]
"hooks" = "agentwarden/hooks"
"prompts" = "agentwarden/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: calls the real model API (costs credits)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
